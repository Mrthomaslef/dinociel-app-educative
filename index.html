<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#D8F1FF" />
  <title>DinoCiel — L'App Éducative de Petit Dino (3 ans)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Soft Sky Background Decor -->
  <div class="sky-decor" aria-hidden="true">
    <div class="cloud cloud-1">☁️</div>
    <div class="cloud cloud-2">☁️</div>
    <div class="sun-glow"></div>
  </div>

  <!-- Confetti & Floating Stars Layer -->
  <div id="celebration-layer" class="celebration-layer" aria-hidden="true"></div>

  <!-- 1-Page App Shell (Fits 100dvh on all iPhones & Desktop) -->
  <div class="app-shell">
    <!-- Compact Clean Header -->
    <header class="top-bar">
      <div class="brand" id="btn-home-brand" role="button" tabindex="0" aria-label="Retour à l'accueil">
        <div class="brand-logo-wrap">
          <img src="assets/dino-emotion-happy.jpg" alt="Petit Dino" class="brand-dino-thumb" />
        </div>
        <div class="brand-text">
          <h1>DinoCiel</h1>
          <span class="age-pill">3 ans</span>
        </div>
      </div>

      <div class="top-actions">
        <button id="btn-stickers-quick" class="star-counter-btn" title="Mes gommettes">
          <span class="star-icon">⭐</span>
          <span id="star-count-value" class="star-count-value">3</span>
        </button>

        <button id="btn-toggle-media" class="control-pill-btn active" title="Basculer entre Images 2D Higgsfield et Vidéos Higgsfield">
          <span id="media-mode-icon">🖼️</span>
          <span id="media-mode-label" class="hide-xs">Images 2D</span>
        </button>

        <button id="btn-toggle-voice" class="control-pill-btn active" aria-pressed="true" title="Activer ou couper la voix de Petit Dino">
          <span id="voice-icon">🔊</span>
        </button>
      </div>
    </header>

    <!-- Main Single-Screen Workspace -->
    <main class="main-layout">
      <!-- PETIT DINO COMPANION (Compact horizontal bar on iPhone, left card on Desktop) -->
      <aside class="mascot-panel" aria-label="Mascotte Petit Dino">
        <div class="mascot-card" id="mascot-card" data-state="idle">
          <!-- Interactive Dino Avatar (Higgsfield 2D) -->
          <div class="mascot-stage" id="mascot-stage" role="button" tabindex="0" title="Touche Petit Dino !">
            <div class="reaction-floaters" id="reaction-floaters">
              <span class="floater f1">✨</span>
              <span class="floater f2">⭐</span>
            </div>

            <div id="dino-3d-container" class="dino-visual-container">
              <img
                id="dino-3d-img"
                src="assets/dino-idle.jpg"
                alt="Petit Dino en dessin 2D Higgsfield"
                class="dino-3d-img"
              />
              <video
                id="dino-video-player"
                class="dino-video-player hidden"
                autoplay
                loop
                muted
                playsinline
              ></video>
              <div class="talking-waves" id="talking-waves" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
              </div>
            </div>
          </div>

          <!-- Speech & Audio Controls -->
          <div class="speech-bubble" id="speech-bubble">
            <div class="mascot-state-badge" id="mascot-state-badge">🦕 Petit Dino</div>
            <p id="dino-speech-text">
              Coucou ! Choisis un jeu avec moi !
            </p>
            <div class="speech-actions">
              <button id="btn-replay-speech" class="btn-listen-Instruction" title="Écouter Petit Dino">
                <span>🔊</span> Écouter
              </button>
              <button id="btn-tickle-dino" class="btn-tickle" title="Faire sauter Petit Dino">
                <span>🦖</span> Coucou !
              </button>
            </div>
          </div>
        </div>
      </aside>

      <!-- DYNAMIC ACTIVITY STAGE (Fits remaining viewport height with zero page scroll) -->
      <section class="content-area">
        <div class="activity-stage" id="activity-stage">
          <!-- Populated dynamically by app.js -->
        </div>
      </section>
    </main>

    <!-- iPhone-Friendly Bottom Navigation Dock -->
    <nav class="world-nav" aria-label="Activités éducatives">
      <button class="world-tab active" data-world="home">
        <span class="tab-emoji">🏠</span>
        <span class="tab-label">Accueil</span>
      </button>
      <button class="world-tab" data-world="counting">
        <span class="tab-emoji">🔢</span>
        <span class="tab-label">Compter</span>
      </button>
      <button class="world-tab" data-world="letters">
        <span class="tab-emoji">🔤</span>
        <span class="tab-label">Lettres</span>
      </button>
      <button class="world-tab" data-world="emotions">
        <span class="tab-emoji">😊</span>
        <span class="tab-label">Émotions</span>
      </button>
      <button class="world-tab" data-world="rules">
        <span class="tab-emoji">🌟</span>
        <span class="tab-label">Règles</span>
      </button>
      <button class="world-tab" data-world="stickers">
        <span class="tab-emoji">🏆</span>
        <span class="tab-label">Étoiles</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
